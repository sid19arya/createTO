[project]
name = "createto-info"
version = "0.1.0"
description = "Crawl createto.ca into a source-cited, versioned Postgres dataset of Toronto real-estate projects."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "scrapy>=2.11",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.111",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.30",
]

[project.scripts]
createto = "createto_info.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/createto_info"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: requires a running Postgres (docker compose up -d db)"]
