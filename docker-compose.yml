services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: createto
      POSTGRES_PASSWORD: createto
      POSTGRES_DB: createto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U createto -d createto"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
