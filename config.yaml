# Pipeline configuration. Secrets (API keys, DB URL) come from .env, not this file.
# The full resolved config is stored on every crawl_runs row for reproducibility.

crawl:
  start_urls:
    - https://createto.ca/
  sitemap_url: https://createto.ca/sitemap.xml
  user_agent: "createto-info/0.1 (+research crawler; contact: see repo README)"
  concurrent_per_domain: 2
  download_delay_s: 0.5
  autothrottle_target_concurrency: 1.0
  max_file_mb: 100                           # largest seen: 77 MB design-guideline PDF
  timeout_s: 90
  retries: 2

scope:
  first_party_hosts: [createto.ca, www.createto.ca]
  asset_hosts: [a-us.storyblok.com]          # CMS file store, treated as first-party
  external_1hop_hosts:                        # fetched only when linked directly from first party
    - www.toronto.ca
    - secure.toronto.ca
    - www.2444eglinton.ca
    - www.merx.com                            # public open-solicitations listing linked from /our-work/procurement
    - comms.cushwakedigital.com               # market-offering pages (CreateTO's land-sale broker)
    - www.canada.ca                           # federal partnership announcements
  # documents (file_extensions) linked directly from createto.ca are fetched from any host
  external_files_any_host: true
  never_fetch_hosts:                          # recorded as links, logged as skipped
    - createto-website-git-uat-create-to-by-sid-lee.vercel.app   # staging copy of the site
    - twitter.com
    - x.com
    - www.instagram.com
    - www.linkedin.com
    - www.youtube.com
    - youtu.be
    - toronto.webex.com
    - fonts.googleapis.com
    - fonts.gstatic.com
  skip_path_prefixes: [/_next/, /images/, /api/]
  # files downloaded from asset / external hosts; other extensions are recorded but not fetched
  file_extensions: [pdf, doc, docx, xls, xlsx, ppt, pptx, csv, txt, rtf, zip]
  media_extensions: [jpg, jpeg, png, gif, webp, svg, avif, ico, mp4, mov, webm, mp3, woff, woff2, css, js]

cutoff:
  years: 5                                    # applies only to projects with phase == completed

models:
  gate: baseten/mammoth-1:free                # POST /api/alpha/decisions (free; project linking)
  extract: openai/gpt-6-luna                  # chosen after reports/model_comparison.md
  vision: openai/gpt-6-luna
  # inkling:free / inkling-small:free answer 403 "only available on agentic harnesses" (2026-10-27),
  # so the comparison and fallback use paid Inkling
  fallback: thinkingmachines/inkling          # no enforced JSON schema
  compare: [openai/gpt-6-luna, thinkingmachines/inkling]
  # OpenRouter list prices, USD per 1M tokens (checked 2026-10-27). Used for *estimated* cost:
  # what a call costs (or would cost on the paid tier, for :free models). Actual billed cost
  # comes from OpenRouter's usage accounting and is logged separately.
  est_price_per_mtok:
    openai/gpt-6-luna: {input: 0.10, output: 0.50}
    thinkingmachines/inkling: {input: 1.00, output: 4.05}
    thinkingmachines/inkling:free: {input: 1.00, output: 4.05}   # paid-tier equivalent
    baseten/mammoth-1:free: {input: 0.0, output: 0.0}

llm:
  base_url: https://openrouter.ai/api
  max_requests_per_run: 1500
  max_cost_usd_per_run: 5.00                  # hard stop on OpenRouter-reported spend
  concurrency: 6
  requests_per_minute: {default: 120, ":free": 18}   # free models are rate limited
  max_output_tokens: 8000
  timeout_s: 180
  pdf_window_pages: 40
  vision_min_text_chars: 200
  vision_max_pages_per_doc: 200                # effectively all first-party image pages (737)
  vision_max_pages_per_run: 1000
  vision_first_party_only: true              # skip image pages of external decks (deferred)
  news_min_chars: 200

storage:
  raw_dir: data/raw
  renders_dir: data/renders
